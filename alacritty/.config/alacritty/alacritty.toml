[env]
TERM = "xterm-256color"

[font]
size = 18.0

[font.normal]
family = "RobotoMono Nerd Font Mono"
style = "Regular"

[window]
decorations = "Transparent" # Options are: Full, Transparent, Buttonless or None
dynamic_padding = true     # True or False, default is false
opacity = 0.84
option_as_alt = "Both"

[window.padding]
x = 1
y = 26

[general]

live_config_reload = true
import = [
  "/Users/rene/.config/alacritty/themes/tokyo_night.toml",
  # "/Users/rene/.config/alacritty/themes/tokyo-night-enhanced.toml",
  # "/Users/rene/.config/alacritty/themes/catppuccin-mocha.toml",
  # "/Users//rene/.config/alacritty/themes/gruvbox_dark.toml"
]

